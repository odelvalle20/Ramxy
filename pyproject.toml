[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-sim"
version = "0.1.0"
description = "Simulacion local y controlada de tasking remoto"
requires-python = ">=3.11"
dependencies = ["Flask>=3.0,<4", "requests>=2.31,<3"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
